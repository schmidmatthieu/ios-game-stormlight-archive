<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cosmere Chronicles" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Cosmere Chronicles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a1a; color: #e6cc66;
      font-family: 'Copperplate', 'Georgia', serif;
      z-index: 100;
    }
    #loading h1 { font-size: 28px; margin-bottom: 12px; }
    #loading p { font-size: 14px; color: #888; }
    .loading-bar {
      width: 200px; height: 4px; background: #222; margin-top: 20px; border-radius: 2px;
    }
    .loading-fill {
      width: 0%; height: 100%; background: #e6cc66; border-radius: 2px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Cosmere Chronicles</h1>
    <p>Les Chroniques du Cosmere</p>
    <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
